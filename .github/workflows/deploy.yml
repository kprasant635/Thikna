name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: composer

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} \
            ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage' \
            -czf deploy.tar.gz .

      - name: Upload deployment package
        run: |
          scp \
            -P ${{ secrets.HOSTINGER_PORT }} \
            deploy.tar.gz \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:/tmp/skopx-deploy.tar.gz

      - name: Deploy on Hostinger
        run: |
          ssh \
            -p ${{ secrets.HOSTINGER_PORT }} \
            ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} << 'EOF'

          set -e

          cd ~/domains/skopx.in/public_html

          echo "Extracting application..."
          tar -xzf /tmp/skopx-deploy.tar.gz

          rm -f /tmp/skopx-deploy.tar.gz

          echo "Installing production dependencies..."
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          echo "Clearing Laravel cache..."
          php artisan optimize:clear

          echo "Optimizing Laravel..."
          php artisan optimize

          echo "Creating storage link..."
          php artisan storage:link || true

          echo "Deployment completed successfully."

          EOF